spring.application.name=security_ms
server.port=8181
spring.datasource.url=jdbc:mysql://localhost:3306/security_ms_db
spring.datasource.username=root
spring.datasource.password=estiven10

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:clave-local-educativa-de-32-bytes}
security.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:5000}
security.two-factor.cookie-secure=${TWO_FACTOR_COOKIE_SECURE:false}

GOOGLE_OAUTH_REDIRECT_URI=http://localhost:3000/auth/callback/google

security.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
security.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:3000/auth/callback/google}
security.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
security.oauth.github.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:3000/auth/callback/github}
security.oauth.cookie-secure=${OAUTH_COOKIE_SECURE:false}
security.oauth.cookie-same-site=${OAUTH_COOKIE_SAME_SITE:Lax}
security.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
security.oauth.github.client-id=${GITHUB_CLIENT_ID:}
